<div class="container-fluid p-4 bg-white" style="min-height: 100vh;">
  
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex align-items-center justify-content-between border-bottom pb-3">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">Tableau de bord analytique</h1>
          <p class="text-muted mb-0">Données visualisées pour la région : <span class="badge bg-primary fs-6">{{ selectedRegion }}</span></p>
        </div>
        <div class="text-muted small">
          Dernière mise à jour : 11 Mars 2026
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    
    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded-4 p-3 bg-light h-100">
        <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-bar-chart-steps me-2"></i>1 : Besoins vs Objectifs Annuels</h6>
        <div class="bg-white p-2 rounded-3" style="height: 350px;">
          <canvas baseChart 
            [data]="mixedChartData" 
            [options]="chartOptions" 
            type="bar">
          </canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded-4 p-3 bg-light h-100">
        <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-house-door me-2"></i>2 : Répartition par Type de Logement</h6>
        <div class="bg-white p-2 rounded-3" style="height: 350px;">
          <canvas baseChart 
            [data]="barChartData" 
            [options]="barChartOptions" 
            type="bar">
          </canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded-4 p-3 bg-light h-100">
        <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-graph-up me-2"></i>3 : Évolution des Attributions Mensuelles</h6>
        <div class="bg-white p-2 rounded-3" style="height: 350px;">
          <canvas baseChart 
            [data]="lineChartData" 
            [options]="chartOptions" 
            type="line">
          </canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded-4 p-3 bg-light h-100">
        <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-radar me-2"></i>4 : Capacité d'Absorption (Social vs Privé)</h6>
        <div class="bg-white p-2 rounded-3" style="height: 350px;">
          <canvas baseChart 
            [data]="radarChartData" 
            [options]="chartOptions" 
            [type]="radarChartType">
          </canvas>
        </div>
      </div>
    </div>

  </div>
</div>
