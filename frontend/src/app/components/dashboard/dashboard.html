<div class="container-fluid p-4">
  <div class="row g-4">
    
    <div class="col-md-6">
      <div class="card h-100 shadow-sm border-0 rounded-4 p-3 bg-light">
        <h5 class="card-title text-center mb-3">1 : Besoins vs Objectifs (Mixte)</h5>
        <div class="bg-white p-2 rounded-3" style="height: 350px;">
          <canvas baseChart 
            [data]="mixedChartData" 
            [options]="chartOptions" 
            type="bar">
          </canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100 shadow-sm border-0 rounded-4 p-3 bg-light">
        <h5 class="card-title text-center mb-3">2 : Répartition par Type de Logement</h5>
        <div class="bg-white p-2 rounded-3" style="height: 350px;">
          <canvas baseChart 
            [data]="barChartData" 
            [options]="barChartOptions" 
            type="bar">
          </canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100 shadow-sm border-0 rounded-4 p-3 bg-light">
        <h5 class="card-title text-center mb-3">3 : Évolution Mensuelle des Attributions</h5>
        <div class="bg-white p-2 rounded-3" style="height: 350px;">
          <canvas baseChart 
            [data]="lineChartData" 
            [options]="chartOptions" 
            type="line">
          </canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100 shadow-sm border-0 rounded-4 p-3 bg-light">
        <h5 class="card-title text-center mb-3">4 : Capacité d’Absorption du Logement Social</h5>
        <div class="bg-white p-2 rounded-3" style="height: 350px;">
          <canvas baseChart 
            [data]="radarChartData" 
            [options]="chartOptions" 
            [type]="radarChartType">
          </canvas>
        </div>
      </div>
    </div>

  </div>
</div>
